<!doctype html>
<!--
  Capa de link da Vincenzo Saggio (1200x630), minimalista: painel marfim com a
  marca e a frase da coleção à esquerda, a foto da abertura à direita. O único
  detalhe é o pesponto, o mesmo dos botões do site.
  Gere a imagem com: powershell -File scripts/capa-link/gerar.ps1
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa de link, Vincenzo Saggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400..700&display=block" rel="stylesheet">
<style>
  :root { --carvao: #1D1A17; --marfim: #F4F0E8; --pedra-txt: #696259; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--marfim); }
  .capa { display: grid; grid-template-columns: 600px 600px; width: 1200px; height: 630px; color: var(--carvao); }

  .texto { display: flex; flex-direction: column; padding: 64px 64px 60px; }
  .marca { font-family: "Bodoni Moda"; font-weight: 600; font-variation-settings: "opsz" 11; font-size: 22px; letter-spacing: .22em; text-transform: uppercase; }
  .pesponto { width: 120px; height: 1px; margin-top: 18px; color: var(--carvao); opacity: .45;
    background: linear-gradient(90deg, currentColor 60%, transparent 0) 0 0 / 10px 1px repeat-x; }
  h1 { margin-top: auto; font-family: "Bodoni Moda"; font-weight: 600; font-variation-settings: "opsz" 11;
    font-size: 70px; line-height: 1.02; letter-spacing: -.02em; }
  .colecao { margin-top: 28px; font-family: "Bodoni Moda"; font-style: italic; font-weight: 400; font-variation-settings: "opsz" 11;
    font-size: 26px; color: var(--pedra-txt); }

  .foto { position: relative; overflow: hidden; }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 38% 30%; }
</style>
</head>
<body>
<div class="capa">
  <div class="texto">
    <p class="marca">Vincenzo Saggio</p>
    <div class="pesponto"></div>
    <h1>O clássico não precisa ser tão rígido.</h1>
    <p class="colecao">Coleção Acervo</p>
  </div>
  <div class="foto"><img src="../../assets/img/6.jpg" alt=""></div>
</div>
</body>
</html>
